name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - uses: ./
        with:
          cli: ./test/fixture-cli.sh
          post-on-pr: 'false'

      - uses: actions/checkout@v4
        with:
          repository: testparity/php-sample
          path: php-sample
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: composer install --prefer-dist --no-interaction
        working-directory: php-sample
      - uses: ./
        with:
          working-directory: php-sample
          post-on-pr: 'false'
